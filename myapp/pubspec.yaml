name: myapp
description: "Food-Pandas: order from neighborhood Filipino food stalls and verified restaurants."
# Prevents the app from being accidentally published to pub.dev.
publish_to: 'none'

# <build-name>+<build-number>. Increase the build number for every store upload.
# Android maps these to versionName/versionCode, iOS to
# CFBundleShortVersionString/CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  # Font for the CupertinoIcons that Flutter's iOS-style widgets reference.
  cupertino_icons: ^2.0.0
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
